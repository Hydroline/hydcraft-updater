.updater_windows: &updater_windows
  name: Publish Windows updater
  docker:
    image: node:24-bookworm
  imports:
    - https://cnb.cool/HydCraft/hydcraft-secrets/-/blob/main/hydcraft-updater-deploy.yml
  stages:
    - name: Download and publish Windows updater
      timeout: 2h
      script: |
        set -eu
        export CNB_REPOSITORY_SLUG="${HYDCRAFT_CNB_REPOSITORY_SLUG:-$CNB_REPO_SLUG}"
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl rclone
        rm -rf /var/lib/apt/lists/*

        test -n "${SOURCE_SHA:-}"
        test -n "${WINDOWS_ASSET_NAME:-}"
        test "${CNB_COMMIT:-}" = "$SOURCE_SHA"
        mkdir -p artifacts
        curl --fail --location --retry 3 \
          --header "Authorization: Bearer $CNB_TOKEN" \
          --output "artifacts/$WINDOWS_ASSET_NAME" \
          "https://cnb.cool/$CNB_REPOSITORY_SLUG/-/commit-assets/download/$SOURCE_SHA/$WINDOWS_ASSET_NAME?share=true"
        node scripts/publish-updater.mjs \
          --platform windows-x86_64 \
          --artifact "artifacts/$WINDOWS_ASSET_NAME" \
          --commit "$SOURCE_SHA"
        if ! node scripts/delete-cnb-commit-asset.mjs \
          --commit "$SOURCE_SHA" \
          --name "$WINDOWS_ASSET_NAME"; then
          echo 'CNB_COMMIT_ATTACHMENT_CLEANUP_FAILED: Windows attachment will expire within one day.' >&2
        fi

.updater_macos: &updater_macos
  name: Publish macOS updater
  docker:
    image: node:24-bookworm
  imports:
    - https://cnb.cool/HydCraft/hydcraft-secrets/-/blob/main/hydcraft-updater-deploy.yml
  stages:
    - name: Download and publish macOS updater
      timeout: 2h
      script: |
        set -eu
        export CNB_REPOSITORY_SLUG="${HYDCRAFT_CNB_REPOSITORY_SLUG:-$CNB_REPO_SLUG}"
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl rclone
        rm -rf /var/lib/apt/lists/*

        test -n "${SOURCE_SHA:-}"
        test -n "${MACOS_ASSET_NAME:-}"
        test "${CNB_COMMIT:-}" = "$SOURCE_SHA"
        mkdir -p artifacts
        curl --fail --location --retry 3 \
          --header "Authorization: Bearer $CNB_TOKEN" \
          --output "artifacts/$MACOS_ASSET_NAME" \
          "https://cnb.cool/$CNB_REPOSITORY_SLUG/-/commit-assets/download/$SOURCE_SHA/$MACOS_ASSET_NAME?share=true"
        node scripts/publish-updater.mjs \
          --platform macos-universal \
          --artifact "artifacts/$MACOS_ASSET_NAME" \
          --commit "$SOURCE_SHA"
        if ! node scripts/delete-cnb-commit-asset.mjs \
          --commit "$SOURCE_SHA" \
          --name "$MACOS_ASSET_NAME"; then
          echo 'CNB_COMMIT_ATTACHMENT_CLEANUP_FAILED: macOS attachment will expire within one day.' >&2
        fi

'release/*':
  api_trigger_updater_deploy:
    - <<: *updater_windows
    - <<: *updater_macos
