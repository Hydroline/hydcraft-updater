.updater_windows: &updater_windows
  name: Publish Windows updater
  docker:
    image: node:24-bookworm
  imports:
    - https://cnb.cool/HydCraft/hydcraft-secrets/-/blob/main/hydcraft-updater-deploy.yml
  stages:
    - name: Download and publish Windows updater
      timeout: 2h
      script: |
        set -eu
        export CNB_REPOSITORY_SLUG="${HYDCRAFT_CNB_REPOSITORY_SLUG:-$CNB_REPO_SLUG}"
        export SOURCE_SHA="${SOURCE_SHA:-$CNB_COMMIT}"
        export WINDOWS_ASSET_NAME="${WINDOWS_ASSET_NAME:-hydcraft-updater.exe}"
        export MACOS_ASSET_NAME="${MACOS_ASSET_NAME:-hydcraft-updater}"
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl rclone
        rm -rf /var/lib/apt/lists/*

        test -n "${SOURCE_SHA:-}"
        test -n "${WINDOWS_ASSET_NAME:-}"
        test "${CNB_COMMIT:-}" = "$SOURCE_SHA"
        mkdir -p artifacts
        curl --fail --location --retry 3 \
          --output "artifacts/$WINDOWS_ASSET_NAME" \
          "https://cnb.cool/$CNB_REPOSITORY_SLUG/-/commit-assets/download/$SOURCE_SHA/$WINDOWS_ASSET_NAME?share=true"
        HYDCRAFT_PUBLISH_RESULT_PATH=artifacts/publish-result.json node scripts/publish-updater.mjs \
          --platform windows-x86_64 \
          --artifact "artifacts/$WINDOWS_ASSET_NAME" \
          --commit "$SOURCE_SHA"
        if node -e "process.exit(JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).published === true ? 0 : 1)" artifacts/publish-result.json; then
          for asset_name in "$WINDOWS_ASSET_NAME" "$MACOS_ASSET_NAME"; do
            if ! node scripts/delete-cnb-commit-asset.mjs --commit "$SOURCE_SHA" --name "$asset_name"; then
              echo "CNB_COMMIT_ATTACHMENT_CLEANUP_FAILED: $asset_name will expire within one day." >&2
            fi
          done
        fi

.updater_macos: &updater_macos
  name: Publish macOS updater
  docker:
    image: node:24-bookworm
  imports:
    - https://cnb.cool/HydCraft/hydcraft-secrets/-/blob/main/hydcraft-updater-deploy.yml
  stages:
    - name: Download and publish macOS updater
      timeout: 2h
      script: |
        set -eu
        export CNB_REPOSITORY_SLUG="${HYDCRAFT_CNB_REPOSITORY_SLUG:-$CNB_REPO_SLUG}"
        export SOURCE_SHA="${SOURCE_SHA:-$CNB_COMMIT}"
        export WINDOWS_ASSET_NAME="${WINDOWS_ASSET_NAME:-hydcraft-updater.exe}"
        export MACOS_ASSET_NAME="${MACOS_ASSET_NAME:-hydcraft-updater}"
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl rclone
        rm -rf /var/lib/apt/lists/*

        test -n "${SOURCE_SHA:-}"
        test -n "${MACOS_ASSET_NAME:-}"
        test "${CNB_COMMIT:-}" = "$SOURCE_SHA"
        mkdir -p artifacts
        curl --fail --location --retry 3 \
          --output "artifacts/$MACOS_ASSET_NAME" \
          "https://cnb.cool/$CNB_REPOSITORY_SLUG/-/commit-assets/download/$SOURCE_SHA/$MACOS_ASSET_NAME?share=true"
        HYDCRAFT_PUBLISH_RESULT_PATH=artifacts/publish-result.json node scripts/publish-updater.mjs \
          --platform macos-universal \
          --artifact "artifacts/$MACOS_ASSET_NAME" \
          --commit "$SOURCE_SHA"
        if node -e "process.exit(JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).published === true ? 0 : 1)" artifacts/publish-result.json; then
          for asset_name in "$WINDOWS_ASSET_NAME" "$MACOS_ASSET_NAME"; do
            if ! node scripts/delete-cnb-commit-asset.mjs --commit "$SOURCE_SHA" --name "$asset_name"; then
              echo "CNB_COMMIT_ATTACHMENT_CLEANUP_FAILED: $asset_name will expire within one day." >&2
            fi
          done
        fi

main:
  web_trigger_updater_publish:
    - <<: *updater_windows
    - <<: *updater_macos

'release/*':
  api_trigger_updater_deploy:
    - <<: *updater_windows
    - <<: *updater_macos
  web_trigger_updater_publish:
    - <<: *updater_windows
    - <<: *updater_macos
