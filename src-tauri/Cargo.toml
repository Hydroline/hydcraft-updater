[package]
name = "hydcraft-updater"
version = "0.1.0"
description = "HydCraft client updater"
authors = ["AurLemon"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "net"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = "0.8"
url = "2"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2"
tauri-plugin-opener = "2"
