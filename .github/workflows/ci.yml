name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - README*
      - readme*
      - '**/README*'
      - '**/readme*'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - README*
      - readme*
      - '**/README*'
      - '**/readme*'

permissions:
  contents: read

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting and types
        run: |
          pnpm exec prettier --check .
          pnpm exec vue-tsc --noEmit

      - name: Check Rust manifest and formatting
        working-directory: src-tauri
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/hydcraft-updater-cargo-metadata.json"
          cargo fmt --check
