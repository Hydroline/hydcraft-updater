name: Deploy updater via CNB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep the lock while the native artifacts are built and handed to CNB. The
  # CI sync job uses the same group, so it cannot replace CNB main mid-deploy.
  group: cnb-updater-main-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync CNB main
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      CNB_REPOSITORY_SLUG: ${{ vars.CNB_REPOSITORY_SLUG }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve main commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate CNB configuration
        run: |
          test -n "$CNB_REPOSITORY_SLUG" || { echo 'CNB_REPOSITORY_SLUG is required.' >&2; exit 1; }
          test -n "$CNB_TOKEN" || { echo 'CNB_TOKEN is required.' >&2; exit 1; }

      - name: Sync main to CNB
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e "PLUGIN_TARGET_URL=https://cnb.cool/$CNB_REPOSITORY_SLUG.git" \
            -e 'PLUGIN_AUTH_TYPE=https' \
            -e 'PLUGIN_USERNAME=cnb' \
            -e "PLUGIN_PASSWORD=$CNB_TOKEN" \
            -e 'PLUGIN_BRANCH=main' \
            -e 'PLUGIN_GIT_USER=cnb' \
            -e 'PLUGIN_GIT_EMAIL=cnb@cnb.cool' \
            -e 'PLUGIN_FORCE=true' \
            tencentcom/git-sync

  build:
    name: Build and upload ${{ matrix.platform }}
    needs: sync
    strategy:
      # Keep platform results independent: a failed upload on one runner must
      # not cancel the other native build before it can report its own result.
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            asset_name: hydcraft-updater.exe
          - platform: macos-universal
            runner: macos-latest
            asset_name: hydcraft-updater
    runs-on: ${{ matrix.runner }}
    env:
      CNB_REPOSITORY_SLUG: ${{ vars.CNB_REPOSITORY_SLUG }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      HYDCRAFT_UPDATER_COMMIT: ${{ needs.sync.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.source_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native updater
        run: node scripts/build-updater.mjs ${{ matrix.platform }}

      - name: Upload build to CNB commit attachments
        shell: bash
        run: |
          node scripts/upload-cnb-commit-asset.mjs \
            --commit "${{ needs.sync.outputs.source_sha }}" \
            --artifact "$(if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then printf '%s' 'src-tauri/target/x86_64-pc-windows-msvc/release/hydcraft-updater.exe'; else printf '%s' 'src-tauri/target/universal-apple-darwin/release/hydcraft-updater'; fi)" \
            --name "${{ matrix.asset_name }}"

  trigger:
    name: Trigger CNB publish pipeline
    needs: [sync, build]
    runs-on: ubuntu-latest
    env:
      CNB_REPOSITORY_SLUG: ${{ vars.CNB_REPOSITORY_SLUG }}
      CNB_API_TOKEN: ${{ secrets.CNB_API_TOKEN }}
    steps:
      - name: Validate CNB configuration
        run: |
          test -n "$CNB_REPOSITORY_SLUG" || { echo 'CNB_REPOSITORY_SLUG is required.' >&2; exit 1; }
          test -n "$CNB_API_TOKEN" || { echo 'CNB_API_TOKEN is required.' >&2; exit 1; }

      - name: Trigger CNB publish pipeline
        run: |
          payload="$(jq -cn \
            --arg event 'api_trigger_updater_deploy' \
            --arg sha "${{ needs.sync.outputs.source_sha }}" \
            '{event: $event, branch: "main", env: {
              SOURCE_SHA: $sha,
              WINDOWS_ASSET_NAME: "hydcraft-updater.exe",
              MACOS_ASSET_NAME: "hydcraft-updater"
            }}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cnb.cool/$CNB_REPOSITORY_SLUG/-/build/start" \
            --header "Authorization: Bearer $CNB_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" | jq .
