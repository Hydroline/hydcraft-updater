name: Deploy updater via CNB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    name: Sync and trigger CNB updater build
    runs-on: ubuntu-latest
    concurrency:
      # Deploys use immutable release/<sha> branches, so different commits can
      # build in parallel while duplicate runs for one commit stay serialized.
      group: cnb-updater-deploy-${{ github.sha }}
      cancel-in-progress: false
    env:
      CNB_REPOSITORY_SLUG: ${{ vars.CNB_REPOSITORY_SLUG }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_API_TOKEN: ${{ secrets.CNB_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Pin the manual run to the commit captured when it was queued.
          # The release branch below keeps the CNB build immutable.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Read source commit
        id: source
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=release/$sha" >> "$GITHUB_OUTPUT"

      - name: Validate CNB configuration
        run: |
          test -n "$CNB_REPOSITORY_SLUG" || { echo 'CNB_REPOSITORY_SLUG is required.' >&2; exit 1; }
          test -n "$CNB_TOKEN" || { echo 'CNB_TOKEN is required.' >&2; exit 1; }
          test -n "$CNB_API_TOKEN" || { echo 'CNB_API_TOKEN is required.' >&2; exit 1; }

      - name: Sync immutable release branch to CNB
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e "PLUGIN_TARGET_URL=https://cnb.cool/$CNB_REPOSITORY_SLUG.git" \
            -e 'PLUGIN_AUTH_TYPE=https' \
            -e 'PLUGIN_USERNAME=cnb' \
            -e "PLUGIN_PASSWORD=$CNB_TOKEN" \
            -e "PLUGIN_BRANCH=release/${{ steps.source.outputs.sha }}" \
            -e 'PLUGIN_GIT_USER=cnb' \
            -e 'PLUGIN_GIT_EMAIL=cnb@cnb.cool' \
            -e 'PLUGIN_FORCE=true' \
            tencentcom/git-sync

      - name: Trigger CNB native build
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CNB_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          payload="$(jq -cn \
            --arg event 'api_trigger_updater_deploy' \
            --arg branch "$CNB_BRANCH" \
            --arg sha "$SOURCE_SHA" \
            '{event: $event, branch: $branch, sha: $sha, env: {SOURCE_SHA: $sha}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cnb.cool/$CNB_REPOSITORY_SLUG/-/build/start" \
            --header "Authorization: $CNB_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" | jq .
